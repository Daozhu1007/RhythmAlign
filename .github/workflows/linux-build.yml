# CP-2 — Linux beta build & validation.
#
# Manually dispatched (workflow_dispatch) so the Owner controls when CI
# builds run; this workflow never publishes a GitHub Release.
#
# Baseline policy: the build runs inside the `ubuntu:22.04` container
# (glibc 2.35, Python 3.10) pinned on a `ubuntu-24.04` runner, so runner
# image lifecycle changes cannot silently move the release floor. The
# dependency stack is pinned via constraints-linux.txt. A second job runs
# the same artifact on the Ubuntu 24.04 runner to evidence forward
# compatibility on a newer environment.

name: Linux beta build

on:
  workflow_dispatch:
    # NOTE: workflow_dispatch becomes triggerable from the UI/API once this
    # file lands on the default branch (release time). Until then the beta
    # build runs on pushes to the packaging branch below.
  push:
    branches:
      - cross-platform/linux
    paths:
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'constraints-linux.txt'
      - 'RhythmAlign.spec'
      - 'packaging/**'
      - '.github/workflows/linux-build.yml'
      - '**/*.py'

jobs:
  build-linux:
    name: Build & validate (Ubuntu 22.04 container)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git python3 python3-venv python3-dev ca-certificates binutils \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - uses: actions/checkout@v4

      - name: Create pinned build environment
        run: |
          python3 -m venv .venv-build
          .venv-build/bin/pip install --upgrade pip
          .venv-build/bin/pip install -r requirements.txt -r requirements-dev.txt \
            -c constraints-linux.txt
          .venv-build/bin/pip freeze > build-env-frozen.txt
          echo "--- glibc ---" && ldd --version | head -1
          echo "--- python ---" && .venv-build/bin/python --version

      - name: Run test suite
        run: .venv-build/bin/python -m pytest tests/ -q

      - name: Build PyInstaller onedir
        run: .venv-build/bin/pyinstaller RhythmAlign.spec --clean --noconfirm

      - name: Package Linux beta artifact
        run: bash packaging/linux/package_artifact.sh

      - name: Validate packaged artifact (headless, full workflow)
        run: |
          tar xzf dist/RhythmAlign-v*-linux-x86_64-beta.tar.gz -C dist
          python3 packaging/linux/validate_artifact.py --app dist/RhythmAlign/RhythmAlign

      - name: Stage release files
        run: |
          mkdir -p release-staging
          cp dist/RhythmAlign-v*-linux-x86_64-beta.tar.gz \
             dist/RhythmAlign-v*-linux-x86_64-beta.tar.gz.sha256 \
             build-env-frozen.txt release-staging/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RhythmAlign-linux-x86_64-beta
          path: release-staging/*
          if-no-files-found: error

  validate-24-04:
    name: Validate on Ubuntu 24.04 runner
    needs: build-linux
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RhythmAlign-linux-x86_64-beta
          path: dist

      - name: Extract and validate on a newer environment
        run: |
          tar xzf dist/RhythmAlign-v*-linux-x86_64-beta.tar.gz -C dist
          python3 packaging/linux/validate_artifact.py --app dist/RhythmAlign/RhythmAlign
